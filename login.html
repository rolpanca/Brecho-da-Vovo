<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favico4.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Meu Brechó</title>
</head>
<body>
    <header>
        <h1>Meu Brechó</h1>
        <p>Faça login na sua conta</p>
    </header>


    <main class="login">
        <section class="login-box">

            <h2>Entrar</h2>

            <form>
                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >                  
                                        
                </div>

                <p id="mensagem-login"></p>
                
                <button type="submit" class="btn-entrar">
                        Entrar
                    </button>

                    <p class="cadastro-link">
                        Não possui uma conta?
                        <a href="cadastro.html">Criar conta</a>
                    </p>

            </form>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Meu Brechó - Todos os direitos reservados</p>
    </footer>
    
    <script src="login.js"></script>
</body>
</html>
