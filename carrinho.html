<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/favico4.png" type="image/x-icon">
    <title>Carrinho - Brechó</title>
</head>
<body>

    <header>
        <h1>Meu Brechó</h1>
        <p>Seu carrinho de compras</p>
    </header>

    <main class="pagina-carrinho">

        <h2>Produtos no Carrinho</h2>

            <div id="lista-carrinho-pagina">

            </div>                      

            <div class="resumo-carrinho">

                <h2>Resumo da compra</h2>

                <div class="linha-resumo">
                    <span>Itens</span>
                    <span id="quantidade-itens">0</span>
                </div>

                <div class="linha-resumo">
                    <span>subtotal</span>
                    <span id="subtotal-carrinho">R$ 0,00</span>
                </div>

                

                <div class="linha-resumo">
                    <span>Frete</span>
                    <span class="frete">Grátis</span>
                </div>    

                <hr>

                    <div class="linha-total">
                        <span>Total</span>
                        <span id="total-carrinho-pagina">R$ 0,00</span>
                    </div>

                    <a href="checkout.html" class="btn-finalizar" aria-label="Finalizar compra">
                        Finalizar Compra
                    </a>

            </div>                 
                        
    </main>



    <footer>
        <p>&copy; 2026 Meu Brechó - Todos os direitos reservados</p>
    </footer>
    
    <script src="carrinho.js"></script>
    
</body>
</html>
